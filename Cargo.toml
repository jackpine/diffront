[package]
name = "diffront"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
unicode-segmentation = "1.13.3"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
